<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="herdr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="80" r="140" fill="#2563eb" opacity="0.25" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="160" fill="#f59e0b" opacity="0.18" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" />
  </g>

  <!-- Icons connection: Telegram to Herdr (Desktop & Terminal) -->
  <g transform="translate(80, 100)">
    <!-- Telegram Icon Card -->
    <rect x="0" y="20" width="120" height="120" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="60" cy="80" r="38" fill="url(#tg-grad)" />
    <!-- Telegram plane glyph -->
    <path d="M44 80 L74 65 L67 92 L61 83 L53 88 Z" fill="#ffffff" />
    <path d="M61 83 L71 71 L56 80 Z" fill="#cbd5e1" opacity="0.8" />

    <!-- Pulsing Signal -->
    <path d="M135 80 H235" stroke="#38bdf8" stroke-dasharray="6,6" stroke-width="3" opacity="0.8" />
    <circle cx="185" cy="80" r="6" fill="#38bdf8" />

    <!-- Herdr Desktop & Terminal Window Card -->
    <rect x="250" y="20" width="150" height="120" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <!-- Window topbar -->
    <rect x="250" y="20" width="150" height="28" rx="20" fill="#0f172a" />
    <path d="M250 36 H400 V48 H250 Z" fill="#0f172a" />
    <!-- Window dots -->
    <circle cx="268" cy="34" r="4" fill="#ef4444" />
    <circle cx="280" cy="34" r="4" fill="#f59e0b" />
    <circle cx="292" cy="34" r="4" fill="#10b981" />
    <!-- Split Panes -->
    <rect x="260" y="54" width="36" height="74" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1" />
    <rect x="304" y="54" width="86" height="74" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1" />
    <!-- Terminal glyph inside right pane -->
    <text x="312" y="78" font-family="monospace" font-size="16" font-weight="bold" fill="#f59e0b">&gt;_</text>
    <rect x="336" y="67" width="10" height="13" fill="#10b981" opacity="0.9" />
    <!-- Mini lines inside terminal pane -->
    <path d="M312 92 H378 M312 104 H360" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g transform="translate(485, 95)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="140" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle">DESKTOP &amp; TERMINAL ORCHESTRATION</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">
      Herdr Telegram Bridge
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="400" fill="#94a3b8">
      Unified remote control for Herdr Desktop &amp; Terminal via Telegram
    </text>

    <!-- Highlights pills with perfectly centered text and no overflow -->
    <g transform="translate(0, 145)">
      <!-- Pill 1: Desktop & Terminal -->
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="82.5" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Desktop &amp; Terminal</text>

      <!-- Pill 2: Zero Dependencies -->
      <rect x="177" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="257" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Zero Dependencies</text>

      <!-- Pill 3: Clean Architecture -->
      <rect x="349" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="429" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Clean Architecture</text>

      <!-- Pill 4: Linux · Mac · Win -->
      <rect x="521" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="593.5" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="middle">Linux · Mac · Win</text>
    </g>
  </g>
</svg>
