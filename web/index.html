<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Herdr Agent Controller</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen selection:bg-blue-600 selection:text-white">
  <div id="app" class="max-w-md mx-auto p-4 flex flex-col min-h-screen pb-12">
    <!-- Header -->
    <header class="flex items-center justify-between pb-3 border-b border-gray-800">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🤖</span>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-none">Herdr Agent Bridge</h1>
          <span class="text-xs text-gray-400 font-mono" id="connection-status">● Conectado</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-refresh" class="p-1.5 rounded-lg bg-gray-900 border border-gray-800 text-gray-300 hover:text-white hover:bg-gray-800 transition active:scale-95" title="Actualizar">
          🔄
        </button>
        <button id="btn-new-agent" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition active:scale-95 flex items-center space-x-1 shadow-sm">
          <span>➕</span>
          <span>Nuevo</span>
        </button>
      </div>
    </header>

    <!-- Agent Selection Chips (Horizontal Carousel) -->
    <div class="py-3">
      <div class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2 flex items-center justify-between">
        <span>Agentes Activos (<span id="agent-count">0</span>)</span>
      </div>
      <div id="agent-chips" class="flex space-x-2 overflow-x-auto pb-1 no-scrollbar">
        <!-- Dynamic chips injected here -->
      </div>
    </div>

    <!-- Active Agent Card -->
    <div id="active-agent-container" class="flex-1 flex flex-col space-y-3">
      <!-- Agent Meta Card -->
      <div class="p-3.5 rounded-xl bg-gray-900/90 border border-gray-800/80 shadow-md">
        <div class="flex items-start justify-between">
          <div class="space-y-0.5">
            <div class="flex items-center space-x-2">
              <span id="agent-icon" class="text-lg">🤖</span>
              <h2 id="agent-title" class="text-base font-bold text-white truncate max-w-[210px]">Cargando...</h2>
            </div>
            <div class="flex items-center space-x-1.5 text-xs text-gray-400">
              <span id="agent-backend-badge" class="px-1.5 py-0.5 rounded bg-gray-800 text-gray-300 font-mono text-[10px] uppercase">TERMINAL</span>
              <span>•</span>
              <span id="agent-engine" class="font-mono text-gray-300">AGY</span>
            </div>
          </div>
          <div id="agent-status-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold flex items-center space-x-1.5 bg-gray-800 text-gray-300 border border-gray-700/60 shadow-sm">
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-pulse"></span>
            <span id="agent-status-text">Iniciando</span>
          </div>
        </div>

        <!-- Quick Action Bar -->
        <div class="mt-3 pt-3 border-t border-gray-800/80 grid grid-cols-5 gap-1.5">
          <button data-quick="test" class="quick-btn py-1.5 px-1 bg-gray-800 hover:bg-gray-700/80 rounded-lg text-xs font-medium text-center text-gray-200 transition active:scale-95 flex flex-col items-center">
            <span class="text-sm">🧪</span>
            <span class="text-[10px] mt-0.5 font-mono">Tests</span>
          </button>
          <button data-quick="diff" class="quick-btn py-1.5 px-1 bg-gray-800 hover:bg-gray-700/80 rounded-lg text-xs font-medium text-center text-gray-200 transition active:scale-95 flex flex-col items-center">
            <span class="text-sm">📊</span>
            <span class="text-[10px] mt-0.5 font-mono">Diff</span>
          </button>
          <button data-quick="push" class="quick-btn py-1.5 px-1 bg-gray-800 hover:bg-gray-700/80 rounded-lg text-xs font-medium text-center text-gray-200 transition active:scale-95 flex flex-col items-center">
            <span class="text-sm">🚀</span>
            <span class="text-[10px] mt-0.5 font-mono">Push</span>
          </button>
          <button data-key="enter" class="key-btn py-1.5 px-1 bg-emerald-950/60 border border-emerald-800/60 hover:bg-emerald-900/60 rounded-lg text-xs font-medium text-center text-emerald-300 transition active:scale-95 flex flex-col items-center">
            <span class="text-sm">✅</span>
            <span class="text-[10px] mt-0.5 font-mono">Enter</span>
          </button>
          <button data-key="esc" class="key-btn py-1.5 px-1 bg-rose-950/60 border border-rose-800/60 hover:bg-rose-900/60 rounded-lg text-xs font-medium text-center text-rose-300 transition active:scale-95 flex flex-col items-center">
            <span class="text-sm">🛑</span>
            <span class="text-[10px] mt-0.5 font-mono">Abortar</span>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex rounded-lg bg-gray-900 p-1 border border-gray-800 text-xs font-medium">
        <button id="tab-btn-result" class="tab-btn flex-1 py-1.5 rounded-md text-center transition bg-blue-600 text-white font-semibold">
          🎯 Resultado
        </button>
        <button id="tab-btn-terminal" class="tab-btn flex-1 py-1.5 rounded-md text-center text-gray-400 hover:text-white transition">
          🖥️ Terminal
        </button>
        <button id="tab-btn-prompt" class="tab-btn flex-1 py-1.5 rounded-md text-center text-gray-400 hover:text-white transition">
          💬 Orden
        </button>
      </div>

      <!-- Tab Content: Result -->
      <div id="tab-content-result" class="tab-pane flex-1 flex flex-col min-h-[220px]">
        <div id="result-view" class="p-3.5 rounded-xl bg-gray-900 border border-gray-800 text-sm leading-relaxed overflow-y-auto max-h-[380px] space-y-2 prose prose-invert prose-sm">
          <p class="text-gray-400 italic">Cargando resultado del agente...</p>
        </div>
      </div>

      <!-- Tab Content: Terminal -->
      <div id="tab-content-terminal" class="tab-pane hidden flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-1.5 text-[11px] text-gray-400 font-mono">
          <span>Salida reciente (autocontrolada)</span>
          <button id="btn-reload-terminal" class="text-blue-400 hover:underline">Recargar</button>
        </div>
        <pre id="terminal-view" class="p-3 rounded-xl bg-black border border-gray-800/80 font-mono text-[11px] text-emerald-400 overflow-y-auto max-h-[360px] whitespace-pre-wrap break-all select-all leading-tight">
Esperando salida de terminal...
        </pre>
      </div>

      <!-- Tab Content: Prompt -->
      <div id="tab-content-prompt" class="tab-pane hidden flex-1 flex flex-col space-y-2.5">
        <div class="p-3.5 rounded-xl bg-gray-900 border border-gray-800 space-y-2.5">
          <label class="block text-xs font-semibold text-gray-300">Nueva orden para el agente:</label>
          <textarea id="prompt-input" rows="4" class="w-full p-2.5 rounded-lg bg-gray-950 border border-gray-800 text-white text-sm focus:outline-none focus:border-blue-500 font-sans" placeholder="Escribí una instrucción clara (ej: corregí el test de auth y hacé commit)..."></textarea>
          <div class="flex justify-end space-x-2">
            <button id="btn-send-prompt" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition active:scale-95 shadow">
              🚀 Enviar Orden
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
